name: Kyoto travel app checks
on:
  push:
    branches:
      - feature/kyoto-themed-inspiration-2026
      - feature/foldable-sessions-2026
      - feature/incense-shopping-by-store-2026
      - feature/curated-itinerary-safe-cloud-import-2026
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/inspiration-tests.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate single-file trip app and curated content
        run: node tests/inspiration.test.cjs
      - name: Install isolated browser test environment
        run: |
          npm install --no-save playwright@1.56.1
      - name: Check responsive layout, adding ideas, legacy data and shopping persistence
        run: node tests/browser.test.cjs
      - name: Attach sanitized screenshots to CI review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-curated-itinerary-ui-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
